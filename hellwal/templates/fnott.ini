anchor=top-right
edge-margin-vertical=12
edge-margin-horizontal=12
notification-margin=8

min-width=320
max-width=420
max-height=160

icon-theme=Adwaita
max-icon-size=48

selection-helper=fuzzel --dmenu0
selection-helper-uses-null-separator=yes

play-sound=aplay ${filename}
scaling-filter=lanczos3

layer=top
dpi-aware=no

background=%%background.hex%%ee
border-color=%%color1.hex%%ff
border-radius=12
border-size=2

padding-vertical=12
padding-horizontal=14

title-font=CommitMonoNF:weight=bold:size=10
title-color=%%color4.hex%%ff
title-format=<i>%a%A</i>

summary-font=CommitMonoNF:weight=bold:size=11
summary-color=%%foreground.hex%%ff
summary-format=<b>%s\n</b>

body-font=CommitMonoNF:size=10
body-color=%%foreground.hex%%ff
body-format=%b

progress-bar-height=6
progress-color=%%color1.hex%%ff
progress-style=bar

default-timeout=6
max-timeout=12
idle-timeout=0

[low]
background=%%background.hex%%dd
border-color=%%color8.hex%%ff
title-color=%%color8.hex%%ff
summary-color=%%color8.hex%%ff
body-color=%%color8.hex%%ff
default-timeout=4

[normal]
background=%%background.hex%%ee
border-color=%%color1.hex%%ff
title-color=%%color4.hex%%ff
summary-color=%%foreground.hex%%ff
body-color=%%foreground.hex%%ff
default-timeout=6

[critical]
background=%%color1.hex%%f2
border-color=%%foreground.hex%%ff
title-color=%%background.hex%%ff
summary-color=%%background.hex%%ff
body-color=%%background.hex%%ff
default-timeout=0
