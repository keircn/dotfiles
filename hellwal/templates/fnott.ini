[main]
min-width=300
max-width=400
anchor=top-right
edge-margin-horizontal=20
edge-margin-vertical=20
border-size=2
border-radius=10
padding-vertical=16
padding-horizontal=20

default-timeout=6
max-timeout=12

dpi-aware=yes

background=%%background.hex%%ff
border-color=%%color2.hex%%ff
title-color=%%color2.hex%%ff
body-color=%%foreground.hex%%ff
title-font=CommitMono Nerd Font:size=11
body-font=CommitMono Nerd Font:size=10
