output=
anchor=top-right
edge-margin-vertical=10
edge-margin-horizontal=10
notification-margin=10
max-width=350
icon-theme=default
max-icon-size=32
stacking-order=bottom-up
selection-helper=fuzzel --dmenu0
selection-helper-uses-null-separator=yes
scaling-filter=lanczos3

layer=top
border-radius=6
border-size=2
padding-vertical=14
padding-horizontal=16
dpi-aware=no

background=262626ff
border-color=525252ff
title-font=sans serif:size=10
title-color=ffffffff
title-format=<b>%a%A</b>
summary-font=sans serif:size=10
summary-color=f2f4f8ff
summary-format=<b>%s</b>\n
body-font=sans serif:size=9
body-color=dde1e6ff
body-format=%b

progress-bar-height=6
progress-color=78a9ffff
progress-style=bar

default-timeout=6
max-timeout=0
idle-timeout=0

[low]
background=161616ff
border-color=393939ff
title-color=82cfffff
summary-color=82cfffff
body-color=525252ff

[normal]
border-color=78a9ffff

[critical]
background=2d1a24ff
border-color=ee5396ff
title-color=ee5396ff
summary-color=ffffffff
body-color=f2f4f8ff
default-timeout=0
